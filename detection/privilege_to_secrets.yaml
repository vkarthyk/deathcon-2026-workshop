id: k8s-cluster-admin-then-secret-collection
title: Cluster-admin grant followed by cluster-wide secret enumeration
version: 3
schema: OCSF 1.3 API Activity with a full k8s_ocsf relational event table and k8s_subjects child relation
query: A regular main.workshop_alerts SQL view; supporting events are rows in main.alert_evidence.
intent: Detect a successful cluster-admin grant followed by successful cluster-wide secret listing by its subject.
severity: high
window_minutes: 15
alert_key: clusterrolebinding create event ID
entity_keys: [provider, account_uid, cluster_name, subject]
required_telemetry: [successful RBAC creates, request roleRef and subjects, secret reads, event time, native principal]
optional_enrichment: [identity mapping, scoped change approvals, IP reputation and network inventory, IdP and PAM user context, Kubernetes CMDB inventory]
severity_policy: Base high (3); +1 malicious read IP, +1 inactive user, +1 restricted production cluster; -1 all read IPs corporate VPN and none malicious, -1 active privileged admin, -1 development cluster; clamp 1..4; missing enrichment neutral.
known_gaps:
  - Group and ServiceAccount grant subjects are not implemented by this rule.
  - Role updates, namespaced RoleBindings and indirect role aggregation are outside scope.
  - Cannot infer secret contents were returned or exfiltrated from a list request alone.
  - Missing read logs or request bodies prevent a negative conclusion.
  - The 90 minute cross-cloud rollup is a bounded batch example, not a production streaming sessionizer.
suppression: Exact actor, subject, role, provider, account and cluster within an approved change interval.
false_positives: [approved maintenance, incident response, legitimate temporary administrative access]
tests: python -m unittest discover -s tests -v
deployment: Review schema adapters, lateness/dedup policy and local logging configuration before deployment.
