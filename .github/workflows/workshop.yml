name: Workshop regression checks
on: [push, pull_request]
jobs:
  offline-workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-notebooks.txt
      - run: python datagen/build_behavioral.py --check
      - run: python -m unittest discover -s tests -v
      - run: LAB2_DIR=solutions/lab2_ocsf python -m pytest labs/lab2_ocsf -q
      - run: python datagen/check_sql_workshop.py
      - run: python datagen/check_tutorials.py
