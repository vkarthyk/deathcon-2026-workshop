name: Native Windows workshop
on: [push, pull_request]
jobs:
  powershell-workshop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install using the native launcher
        shell: powershell
        run: .\setup.ps1 -Python (Get-Command python).Source -PrepareOnly
      - name: Check Windows notebook runtime without an LLM
        shell: powershell
        run: |
          $code = @'
          from pathlib import Path
          import tempfile
          from workshop.jupyter import NotebookSession
          from workshop.normalization import normalize_bindings
          from solutions.binding_exercise.mappings import MAPPINGS
          from solutions.binding_exercise.queries import detection
          from agent.triage import run
          with tempfile.TemporaryDirectory() as directory:
              session = NotebookSession(Path(directory) / 'rule.sql')
              try:
                  assert session.execute('SELECT count(*) AS n FROM enterprise.k8s_ocsf')[0]['n'] > 100000
                  for cloud in ('eks', 'gke', 'aks'):
                      session.execute(detection(cloud), check_binding=cloud)
                  normalize_bindings(session, MAPPINGS)
                  for mode in ('normalized', 'normalized-success'):
                      session.execute(detection(mode), check_binding=mode)
                  key = session.execute('SELECT alert_key FROM main.workshop_alerts LIMIT 1')[0]['alert_key']
                  result = run(session.engine, key, split='enterprise')
                  assert result['assessment']['claims']
              finally:
                  session.close()
          print('PASS: native Windows setup, notebook checks and scripted investigation')
          '@
          $code | & .\.workshop-venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
